<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 아파트 경매 모니터</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f5bea; --accent-soft: #e8eefe; --new: #e8590c; --tag: #f1f3f5; --low: #c92a2a;
    --sold: #2b8a3e; --sold-soft: #e6f4ea; --dday: #e8590c; --dday-soft: #fff1e6; --star: #f59f00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f25; --text:#e8eaed; --muted:#9aa3ad; --line:#2a3038;
      --accent:#7c9cff; --accent-soft:#1f2a4a; --new:#ff8a4c; --tag:#242a32; --low:#ff6b6b;
      --sold:#69db7c; --sold-soft:#1c2e22; --dday:#ff9a5c; --dday-soft:#33241a; --star:#ffd43b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { padding: 24px 16px 4px; max-width: 1100px; margin: 0 auto; position: relative; }
  h1 { padding-right: 48px; }
  .ovbtn { position: absolute; top: 20px; right: 16px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; display: grid; place-items: center; }
  .ovbtn:hover, .ovbtn.on { border-color: var(--accent); color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 8px 0 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tblwrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 420px; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 8px 0 4px; overflow-x: auto; }
  .tabs button { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--text); border-color: var(--accent); }
  .tabs .n { font-weight: 700; margin-left: 4px; color: var(--accent); }
  .tabs .n.hot { background: var(--new); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; }
  .search { display: flex; gap: 10px; align-items: center; margin: 12px 0 0; flex-wrap: wrap; }
  .search input { flex: 1; min-width: 220px; font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .search input:focus { outline: none; border-color: var(--accent); }
  mark { background: var(--dday-soft); color: inherit; border-radius: 2px; }
  .filters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 10px 0 2px; font-size: 14px; }
  .filters label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .filters input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .filters .cnt { color: var(--muted); font-size: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0 12px; flex-wrap: wrap; }
  .bar h2 { font-size: 17px; margin: 0; }
  .bar .right { display: flex; gap: 10px; align-items: center; }
  select, .btn { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .btn { cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; position: relative; transition: opacity .2s; }
  .card.unread { border-left: 3px solid var(--new); }
  .card.starred { box-shadow: 0 0 0 1px var(--star) inset; }
  .card.seen-now { opacity: .55; }
  .card img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; background: var(--tag); flex: none; }
  .body { min-width: 0; flex: 1; }
  .star { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--line); padding: 4px; }
  .star.on { color: var(--star); }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-right: 26px; }
  .chip { font-size: 11px; border-radius: 4px; padding: 0 5px; font-weight: 700; }
  .chip.new { background: var(--new); color: #fff; }
  .chip.drop { background: var(--accent-soft); color: var(--accent); }
  .dd { background: var(--dday-soft); color: var(--dday); }
  .dd.past { background: var(--tag); color: var(--muted); }
  .soldchip { background: var(--sold-soft); color: var(--sold); }
  .addr { font-weight: 600; margin: 2px 0 6px; font-size: 14px; color: inherit; text-decoration: none; display: block; }
  .addr:hover { color: var(--accent); }
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 13px; margin: 0; }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; font-variant-numeric: tabular-nums; }
  .low { color: var(--low); font-weight: 700; }
  .sold { color: var(--sold); font-weight: 700; }
  .small { font-size: 11px; color: var(--muted); }
  .strike { text-decoration: line-through; }
  .tags { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tags span { background: var(--tag); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--muted); }
  .tags span.warn { background: var(--dday-soft); color: var(--dday); font-weight: 600; }
  .foot { margin-top: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  a.ext { color: var(--accent); text-decoration: none; font-size: 12px; }
  .seenbtn { font-size: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; }
  .empty { padding: 40px; text-align: center; color: var(--muted); background: var(--card); border-radius: 12px; border: 1px dashed var(--line); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
</style>
</head>
<body>
<header>
  <h1>서울 아파트 경매 모니터</h1>
  <button class="ovbtn" id="ovbtn" title="낙찰 통계 개요" aria-label="낙찰 통계 개요">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>
  </button>
  <div class="sub">경매마당 · 아파트 · 지분경매 제외 · 감정가 10억↑ · 최저가 <span id="maxlow"></span>↓ · 매일 9시 수집 · 13시·18시 매각결과 · <span id="updated"></span></div>
  <div class="sub" id="savebar" style="display:none;margin-top:6px"></div>
</header>
<div class="wrap" id="overview" style="display:none"></div>
<div class="wrap" id="main">
  <div class="tabs" id="tabs"></div>
  <div class="search">
    <input type="search" id="q" placeholder="아파트 이름, 구, 동, 사건번호로 검색 (예: 은마, 강남구, 대치동)" autocomplete="off">
    <span class="sub" id="qinfo"></span>
  </div>
  <div class="filters" id="filters">
    <span class="sub">기본으로 숨김 · 체크하면 함께 보기</span>
    <label><input type="checkbox" data-tag="선순위임차인"> 선순위임차인 <span class="cnt"></span></label>
    <label><input type="checkbox" data-tag="임차권등기"> 임차권등기 <span class="cnt"></span></label>
    <label><input type="checkbox" data-tag="선순위가등기"> 선순위가등기 <span class="cnt"></span></label>
    <label><input type="checkbox" data-tag="유치권"> 유치권 <span class="cnt"></span></label>
    <span class="sub" id="hidden"></span>
  </div>
  <div class="bar">
    <h2 id="title"></h2>
    <div class="right">
      <button class="btn" id="showhidden" style="display:none"></button>
      <button class="btn" id="allseen" style="display:none">모두 확인 처리</button>
      <label class="sub">정렬
        <select id="sort">
          <option value="rate">감정가 대비 최저가 낮은순</option>
          <option value="bid">매각기일 빠른순</option>
          <option value="eval">감정가 높은순</option>
          <option value="recent">매각일 최근순</option>
          <option value="gap">시세 대비 최저가 낮은순</option>
        </select>
      </label>
    </div>
  </div>
  <div id="note"></div>
  <div class="grid" id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__DATA__*/null;
const won = n => {
  if (!n) return "-";
  const eok = Math.floor(n / 1e8), man = Math.round((n % 1e8) / 1e4);
  return (eok ? eok + "억" : "") + (man ? man.toLocaleString() + "만" : "") + "원";
};
const pct = (a, b) => (a && b) ? Math.round(a / b * 100) + "%" : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

// D-day는 페이지를 여는 날 기준
const now = new Date(); now.setHours(0, 0, 0, 0);
const dday = d => d ? Math.round((new Date(d + "T00:00:00") - now) / 864e5) : null;
const ddayLabel = n => n === null ? "" : n > 0 ? `D-${n}` : n === 0 ? "D-DAY" : `D+${-n}`;
const marketRef = it => it.market?.recent_avg || null;

// ---- 서버 저장 (확인함 / 집중 모니터링) ----
// ---- 확인함 / ★ / 숨김 저장 ----
// local : 이 컴퓨터의 server.py (SQLite)
// github: 공개 페이지. 무료 DB(Firebase Realtime Database)에 저장해 모두가 공유.
//         '공유 링크'(주소 뒤 #k=키)로 한 번 들어온 기기만 읽고 쓸 수 있음.
const MODE = DATA.mode || "local";
async function api(path, body) {
  if (MODE === "github") return shared.save(path, body);
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    return true;
  } catch (e) { toast("저장하지 못했습니다. 서버(localhost:8765)가 켜져 있는지 확인하세요."); return false; }
}

const shared = {
  KEY: "auction_app.boardKey",
  key: "", ok: false,
  init() {
    const m = location.hash.match(/k=([A-Za-z0-9_-]{20,})/);
    try {
      if (m) localStorage.setItem(this.KEY, m[1]);
      this.key = m ? m[1] : localStorage.getItem(this.KEY) || "";
    } catch (e) { this.key = m ? m[1] : ""; }
  },
  ready() { return !!(DATA.firebase_url && this.key); },
  url(path) { return `${DATA.firebase_url.replace(/\/$/, "")}/boards/${this.key}/items${path}.json`; },
  async load() {
    if (!this.ready()) return;
    const r = await fetch(this.url(""), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const state = (await r.json()) || {};
    this.ok = true;
    for (const it of ALL) {
      const st = state[it.m_code] || {};
      it.starred = !!st.starred;
      it.hidden = !!st.hidden;
      // 유찰로 다시 조건에 들어오면(qualified_on 이 확인한 날보다 뒤) 다시 '미확인'
      it.viewed = !!st.viewed_at && (!it.qualified_on || st.viewed_at.slice(0, 10) >= it.qualified_on);
    }
  },
  // 성공했을 때만 true. 실패하면 화면 표시를 되돌림 (저장된 것처럼 보이지 않게)
  async save(path, body) {
    if (!this.ready()) {
      toast(DATA.firebase_url ? "저장하려면 공유 링크로 한 번 접속해야 합니다." : "공유 저장소(DB)가 아직 연결되지 않아 저장할 수 없습니다.");
      return false;
    }
    const patch = {};
    if (path === "/api/view") {
      const now = new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 19);  // 한국시간
      for (const c of body.m_codes) patch[`${c}/viewed_at`] = now;
    }
    if (path === "/api/star") patch[`${body.m_code}/starred`] = body.starred || null;
    if (path === "/api/hide") patch[`${body.m_code}/hidden`] = body.hidden || null;
    try {
      const r = await fetch(this.url(""), { method: "PATCH", body: JSON.stringify(patch) });
      if (!r.ok) throw new Error(r.status);
      return true;
    } catch (e) { toast("저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요."); return false; }
  },
};

function setSaveBar() {
  if (MODE !== "github") return;
  const bar = $("savebar"); bar.style.display = "";
  bar.textContent = !DATA.firebase_url ? "읽기 전용 — 공유 저장소(DB)가 아직 연결되지 않았습니다."
    : !shared.key ? "읽기 전용 — ★·확인함을 저장하려면 공유 링크로 접속하세요."
    : shared.ok ? "★·확인함·숨김은 공유 링크를 가진 모두에게 함께 보입니다."
    : "공유 저장소에 연결하는 중…";
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000); }

// ---- 임차인 필터 (브라우저에 기억) ----
const TENANT_TAGS = ["선순위임차인", "임차권등기", "선순위가등기", "유치권"];  // 기본으로 숨기는 특수권리
const PREF_KEY = "auction_app.showTags";
let showTags = new Set();
try { showTags = new Set(JSON.parse(localStorage.getItem(PREF_KEY) || "[]")); } catch (e) {}
const passTenant = it => it.starred || !(it.special_right || []).some(t => TENANT_TAGS.includes(t) && !showTags.has(t));

const ALL = DATA.items;
const byCode = Object.fromEntries(ALL.map(it => [it.m_code, it]));
const tracked = it => it.qualified_on || it.starred;
// 신규: 첫 수집 이후 조건에 들어왔고, 아직 진행 중(매각기일 전)이며, 눌러보지 않은 물건
const isSold = it => it.result?.state === "매각" && it.result.date >= it.m_bid_date;
// 매각 결과: 한 번 올라온 물건은 계속 남음 (숨김 처리만 가능)
// 매각 결과는 모니터링과 같은 기준: 감정가 10억 이상 · 최저가 20억 이하
const RESULT_EVAL_MIN = 1e9;
const inResult = it => !!tracked(it) && it.m_evaluate_price >= RESULT_EVAL_MIN && it.low_price <= DATA.max_low_price && (!!it.result || !it.active || dday(it.m_bid_date) <= 0);
let showHidden = false;
const WAIT_LOW_MAX = 25e8;  // 가격 대기는 최저가 25억 이하만 보여줌 (넘는 물건도 수집은 계속)
const isNew = it => !isSold(it) && !!it.qualified_on && !it.baseline && !it.viewed && it.active && it.qualifies && !(dday(it.m_bid_date) < 0);
const VIEWS = {
  new:     { label: "신규 (미확인)", filter: isNew,
             title: n => `아직 확인하지 않은 물건 ${n}건`, empty: "확인하지 않은 신규 물건이 없습니다." },
  star:    { label: "★ 집중 모니터링", filter: it => it.starred,
             title: n => `집중 모니터링 ${n}건`, empty: "카드 오른쪽 위 ☆를 눌러 집중 모니터링할 물건을 표시하세요." },
  all:     { label: "모니터링 중", filter: it => it.active && it.qualifies && !isSold(it),
             title: n => `조건(최저가 ${won(DATA.max_low_price)} 이하)을 만족하는 진행 물건 ${n}건`, empty: "조건을 만족하는 진행 물건이 없습니다." },
  wait:    { label: "가격 대기", filter: it => it.active && !it.qualifies && it.low_price <= WAIT_LOW_MAX && !isSold(it),
             title: n => `최저가 ${won(DATA.max_low_price)} 초과 ~ ${won(WAIT_LOW_MAX)} 이하 대기 물건 ${n}건 · 유찰로 내려오면 신규로 들어옵니다`, empty: "가격 대기 물건이 없습니다." },
  result:  { label: "매각 결과", filter: it => inResult(it) && !!it.hidden === showHidden,
             title: n => showHidden ? `숨긴 물건 ${n}건` : `매각 결과 ${n}건 · 감정가 10억↑·최저가 20억↓ (매각기일 당일 포함, 계속 누적)`, empty: "표시할 물건이 없습니다." },
};
let tab = "new";
const sortByTab = { result: "recent" };
const seenThisSession = new Set();  // 이번에 확인한 카드는 새로고침 전까지 흐리게 남겨둠

// ---- 검색: 아파트 이름·구·동·주소·사건번호. 띄어쓰기로 여러 단어를 넣으면 모두 포함하는 물건만 ----
const norm = s => String(s ?? "").toLowerCase().replace(/\s+/g, "");
for (const it of ALL) {
  it._search = norm([it.addr, it.danji_name, it["2depth_addr"], it.jibun_region_2depth_name,
    it.jibun_region_3depth_name, it.case_num, it.bubwon].join(" "));
}
let query = [];
const passQuery = it => query.every(w => it._search.includes(w));

function listFor(id) {
  return ALL.filter(it => passTenant(it) && passQuery(it) && (VIEWS[id].filter(it) || (id === "new" && seenThisSession.has(it.m_code))));
}

function renderTabs() {
  $("tabs").innerHTML = Object.entries(VIEWS).map(([id, v]) => {
    const n = listFor(id).filter(it => !(id === "new" && it.viewed)).length;
    const hot = id === "new" && n > 0 ? " hot" : "";
    return `<button data-t="${id}" class="${id === tab ? "on" : ""}">${v.label}<span class="n${hot}">${n}</span></button>`;
  }).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; seenThisSession.clear(); render(); });
  // 체크박스 옆 건수와 숨김 건수는 '현재 탭 + 검색' 기준
  const inTab = ALL.filter(it => passQuery(it) && VIEWS[tab].filter(it));
  document.querySelectorAll("#filters input").forEach(cb => {
    const tag = cb.dataset.tag;
    cb.checked = showTags.has(tag);
    cb.parentElement.querySelector(".cnt").textContent = `${inTab.filter(it => (it.special_right || []).includes(tag)).length}건`;
  });
  const hidden = inTab.filter(it => !passTenant(it)).length;
  $("hidden").textContent = hidden ? `· 이 탭에서 ${hidden}건 숨김` : "";
}

function marketRows(it) {
  const m = it.market;
  if (m && m.count) {
    const l = m.latest;
    return `<dt>시세(같은 평형)</dt><dd><b>${won(m.recent_avg)}</b> <span class="small">최근 ${m.recent_n}건 평균</span><br>
      <span class="small">최근 거래 ${esc(l.date)} ${won(l.price)} · ${esc(l.floor)}층 · ${l.area}㎡</span></dd>
      <dt>최저가/시세</dt><dd>${pct(it.low_price, m.recent_avg)}</dd>`;
  }
  if (m && m.count === 0) return `<dt>시세(같은 평형)</dt><dd class="small">최근 ${m.months}개월 같은 평형 실거래 없음</dd>`;
  return `<dt>시세</dt><dd><span class="small">${it.danji_trade_avg ? `단지 평균 ${won(it.danji_trade_avg)} (평형 무관)` : "-"}</span></dd>`;
}

function resultRows(it) {
  const r = it.result;
  if (r && r.state === "매각" && r.sold_price)
    return `<dt>매각액</dt><dd><span class="sold">${won(r.sold_price)}</span> <span class="small">(감정가의 ${pct(r.sold_price, it.m_evaluate_price)}) ${esc(r.date)}${r.status && r.status !== "매각" ? ` · ${esc(r.status)}` : ""}</span></dd>
      <dt>시세 대비 낙찰가</dt><dd>${marketRef(it) ? `<span class="sold">${pct(r.sold_price, marketRef(it))}</span> <span class="small">같은 평형 최근 ${it.market.recent_n}건 평균 대비</span>` : `<span class="small">같은 평형 실거래가 없어 계산 불가</span>`}</dd>`;
  if (r) return `<dt>결과</dt><dd>${esc(r.state)} <span class="small">${esc(r.date)}</span></dd>`;
  if (dday(it.m_bid_date) <= 0 && inResult(it)) return `<dt>결과</dt><dd class="small">결과 확인 중 (13시·18시·다음 날 9시에 다시 확인)</dd>`;
  if (!it.active) return `<dt>결과</dt><dd class="small">매각기일 전에 목록에서 빠짐 (변경·취하 등)</dd>`;
  return "";
}

function hl(text) {
  let out = esc(text);
  const words = $("q").value.trim().split(/\s+/).filter(Boolean).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return out;
  return out.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>");
}

function card(it) {
  const n = dday(it.m_bid_date);
  const area = it.areas?.build ? `${it.areas.build.m}㎡(${it.areas.build.p}평)` : "";
  const sold = isSold(it);
  const unread = isNew(it);
  const entry = !it.qualified_on || it.entry_reason === "result" ? "" : it.entry_reason === "price_drop"
    ? `<span class="chip drop">유찰로 진입 ${esc(it.qualified_on.slice(5))}</span>`
    : (!it.baseline ? `<span class="chip ${unread ? "new" : "drop"}">${unread ? "NEW" : "새로 등록"} ${esc(it.qualified_on.slice(5))}</span>` : "");
  const prev = it.prev_low_price && it.prev_low_price !== it.low_price
    ? ` <span class="small strike">${won(it.prev_low_price)}</span>` : "";
  const gap = !it.qualifies && it.active ? `<dt>조건까지</dt><dd class="small">최저가가 ${won(it.low_price - DATA.max_low_price)} 더 내려와야 함</dd>` : "";
  const link = `https://madangs.com${esc(it.case_url)}`;
  const cls = ["card", unread ? "unread" : "", it.starred ? "starred" : "", seenThisSession.has(it.m_code) ? "seen-now" : ""].join(" ");
  return `<div class="${cls}" data-code="${esc(it.m_code)}">
    <button class="star ${it.starred ? "on" : ""}" data-act="star" title="집중 모니터링">${it.starred ? "★" : "☆"}</button>
    <img src="${esc(it.img_url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="body">
      <div class="meta">${entry}
        ${sold ? '<span class="chip soldchip">매각</span>' : `<span class="chip dd ${n < 0 ? "past" : ""}">${ddayLabel(n)}</span>`}
        <span>${esc(it.case_num)}</span><span>${esc(it.bubwon)}</span></div>
      <a class="addr" href="${link}" target="_blank" rel="noopener" data-act="view">${hl(it.addr)}</a>
      ${it.danji_name && !norm(it.addr).includes(norm(it.danji_name)) ? `<div class="small" style="margin:-4px 0 6px">${hl(it.danji_name)}</div>` : ""}
      <dl class="rows">
        <dt>매각기일</dt><dd>${esc(it.m_bid_date)} <b>${ddayLabel(n)}</b> · ${esc(it.state)}</dd>
        <dt>감정가</dt><dd>${won(it.m_evaluate_price)}</dd>
        <dt>최저가</dt><dd><span class="low">${won(it.low_price)}</span> (${pct(it.low_price, it.m_evaluate_price)})${prev}</dd>
        ${gap}
        ${resultRows(it)}
        ${marketRows(it)}
        <dt>전용</dt><dd>${area}</dd>
      </dl>
      ${(it.special_right || []).length ? `<div class="tags">${it.special_right.map(t => `<span class="${TENANT_TAGS.includes(t) ? "warn" : ""}">${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="foot">
        <a class="ext" href="${link}" target="_blank" rel="noopener" data-act="view">경매마당</a>
        ${it.naver_apt_url ? `<a class="ext" href="${esc(it.naver_apt_url)}" target="_blank" rel="noopener" data-act="view">네이버부동산</a>` : ""}
        ${tab === "result" ? `<button class="seenbtn" data-act="hide">${it.hidden ? "다시 보이기" : "숨기기"}</button>` : ""}
        ${unread ? `<button class="seenbtn" data-act="seen">확인함으로 표시</button>` : ""}
      </div>
    </div></div>`;
}

const SORTS = {
  recent: (a, b) => String(b.result?.date || b.m_bid_date).localeCompare(String(a.result?.date || a.m_bid_date)),
  bid: (a, b) => String(a.m_bid_date).localeCompare(String(b.m_bid_date)),
  eval: (a, b) => b.m_evaluate_price - a.m_evaluate_price,
  rate: (a, b) => (a.low_price / a.m_evaluate_price) - (b.low_price / b.m_evaluate_price) || String(a.m_bid_date).localeCompare(String(b.m_bid_date)),
  gap: (a, b) => (marketRef(a) ? a.low_price / marketRef(a) : 9) - (marketRef(b) ? b.low_price / marketRef(b) : 9),
};
function render() {
  renderTabs();
  const list = listFor(tab);
  const s = sortByTab[tab] || "rate";
  $("sort").value = s;
  list.sort(SORTS[s]);
  const hiddenN = ALL.filter(it => inResult(it) && it.hidden).length;
  $("showhidden").style.display = tab === "result" && (hiddenN || showHidden) ? "" : "none";
  $("showhidden").textContent = showHidden ? "매각 결과로 돌아가기" : `숨긴 물건 ${hiddenN}건 보기`;
  const unreadCount = list.filter(it => !it.viewed).length;
  $("title").textContent = VIEWS[tab].title(tab === "new" ? unreadCount : list.length);
  $("allseen").style.display = tab === "new" && unreadCount ? "" : "none";
  const rule = tab !== "new" ? "" :
    `<div class="note"><b>신규 기준</b> · 첫 수집(${esc(DATA.first_run || "-")}) 이후 ① 목록에 <b>새로 등록</b>됐거나 ② <b>유찰 등으로 최저가가 ${won(DATA.max_low_price)} 이하</b>가 된 물건 중, 아직 눌러보지 않은 것. 링크를 누르거나 '확인함'을 누르면 빠지고, 매각기일이 지나거나 목록에서 빠져도 제외됩니다.${MODE === "github" ? " 확인함은 모두가 함께 씁니다." : ""}</div>`;
  $("note").innerHTML = rule + (DATA.has_molit_key ? "" :
    `<div class="note">같은 평형 시세를 보려면 국토교통부 아파트 매매 실거래가 API 키를 <code>MOLIT_API_KEY</code>로 넣어 주세요 (로컬은 <code>.env</code>, GitHub는 Settings › Secrets). 그 전에는 경매마당의 단지 평균(평형 무관)만 표시됩니다.</div>`);
  $("list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">${VIEWS[tab].empty}</div>`;
}

async function markSeen(codes) {
  codes = codes.filter(c => !byCode[c].viewed);
  if (!codes.length) return;
  codes.forEach(c => { byCode[c].viewed = true; seenThisSession.add(c); });
  render();
  if (!await api("/api/view", { m_codes: codes })) {
    codes.forEach(c => { byCode[c].viewed = false; seenThisSession.delete(c); });
    render();
  }
}

$("list").addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const code = el.closest(".card").dataset.code, it = byCode[code];
  if (el.dataset.act === "hide") {
    it.hidden = !it.hidden;
    render();
    if (!await api("/api/hide", { m_code: code, hidden: it.hidden })) { it.hidden = !it.hidden; render(); }
  } else if (el.dataset.act === "star") {
    it.starred = !it.starred;
    render();
    if (!await api("/api/star", { m_code: code, starred: it.starred })) { it.starred = !it.starred; render(); }
  } else {
    markSeen([code]);  // 링크를 누르면(새 탭) 확인함으로 저장
  }
});
$("allseen").onclick = () => markSeen(listFor("new").map(it => it.m_code));
document.querySelectorAll("#filters input").forEach(cb => cb.onchange = () => {
  cb.checked ? showTags.add(cb.dataset.tag) : showTags.delete(cb.dataset.tag);
  try { localStorage.setItem(PREF_KEY, JSON.stringify([...showTags])); } catch (e) {}
  render();
});
$("sort").onchange = () => { sortByTab[tab] = $("sort").value; render(); };
$("showhidden").onclick = () => { showHidden = !showHidden; render(); };
$("q").addEventListener("input", () => {
  query = $("q").value.trim().split(/\s+/).filter(Boolean).map(norm);
  // 검색어가 있으면 각 탭 건수가 검색 결과 기준으로 바뀜
  $("qinfo").textContent = query.length
    ? `전체 ${ALL.filter(it => passTenant(it) && passQuery(it) && Object.values(VIEWS).some(v => v.filter(it))).length}건 일치` : "";
  render();
});
// ---- 개요: 서울 아파트 낙찰가율 (월별·누적, 감정가 구간별) ----
const BANDS = [["전체", () => true], ["15억 미만", e => e < 15e8], ["15억~25억 미만", e => e >= 15e8 && e < 25e8], ["25억 이상", e => e >= 25e8]];
function renderOverview() {
  const st = DATA.stats;
  const sales = st ? Object.values(st.sales) : [];
  if (!sales.length) { $("overview").innerHTML = `<div class="empty">아직 통계 데이터가 없습니다.</div>`; return; }
  const months = [...new Set(sales.map(s => s[0].slice(0, 7)))].sort();
  const calc = (rows, f) => {
    let n = 0, ev = 0, price = 0;
    for (const [, e, p] of rows) if (f(e)) { n++; ev += e; price += p; }
    return { n, rate: ev ? (price / ev * 100).toFixed(1) + "%" : "-" };
  };
  const table = pick => `<div class="tblwrap"><table><thead><tr><th>월</th>${BANDS.map(b => `<th>${b[0]}</th>`).join("")}</tr></thead><tbody>${
    [...months].reverse().map(m => `<tr><td>${m}</td>${BANDS.map(([, f]) => {
      const c = calc(sales.filter(s => pick(s[0].slice(0, 7), m)), f);
      return `<td><b>${c.rate}</b> <span class="small">${c.n}건</span></td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("overview").innerHTML = `
    <div class="bar"><h2>서울 아파트 낙찰가율 · ${st.since.slice(0, 4)}년부터</h2><button class="btn" id="ovback">물건 목록으로</button></div>
    <div class="tiles">${BANDS.map(([name, f]) => { const c = calc(sales, f);
      return `<div class="tile"><span class="sub">${name} · 누적</span><b>${c.rate}</b><span class="small">낙찰 ${c.n}건</span></div>`; }).join("")}</div>
    <div class="bar"><h2>월별</h2></div>${table((s, m) => s === m)}
    <div class="bar"><h2>누적 (1월부터 해당 월까지)</h2></div>${table((s, m) => s <= m)}
    <div class="note">낙찰가율 = 낙찰가 합계 ÷ 감정가 합계. 금액대는 감정가 기준. 서울 아파트 전체(가격 제한 없음, 지분경매 제외). 경매마당이 '아파트'로 분류한 소형 주택과 선순위임차인 물건의 낮은 낙찰가도 포함됩니다. 마지막 갱신 ${esc(st.updated)}, 이번 달은 진행 중인 수치입니다.<br>낙찰률(경매에 나온 건수 중 낙찰 비율)은 기일별 내역을 수집하지 않아 제공하지 않습니다.</div>`;
  $("ovback").onclick = () => showOverview(false);
}
function showOverview(on) {
  if (on) renderOverview();
  $("overview").style.display = on ? "" : "none";
  $("main").style.display = on ? "none" : "";
  $("ovbtn").classList.toggle("on", on);
  scrollTo(0, 0);
}
$("ovbtn").onclick = () => showOverview($("overview").style.display === "none");

$("maxlow").textContent = won(DATA.max_low_price);
$("updated").textContent = DATA.last_run ? `마지막 수집 ${DATA.last_run.replace("T", " ")}` : "";
render();
if (MODE === "github") {
  const sync = () => shared.load().then(() => { setSaveBar(); render(); })
    .catch(() => toast("공유된 ★·확인함 표시를 불러오지 못했습니다."));
  shared.init(); setSaveBar(); sync();
  // 다른 사람이 바꾼 표시: 화면으로 돌아올 때와 1분마다 다시 읽음
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  setInterval(() => { if (!document.hidden) sync(); }, 60000);
  addEventListener("hashchange", () => { shared.init(); sync(); });
}
</script>
</body>
</html>
