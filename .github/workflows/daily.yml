name: daily-collect

on:
  schedule:
    - cron: "0 0 * * *"        # 매일 00:00 UTC = 한국시간 오전 9시 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
    - cron: "0 4,9 * * *"      # 13:00, 18:00 KST: 매각결과만 갱신 (알림 없음)
  workflow_dispatch:            # Actions 탭에서 'Run workflow' 로 수동 실행
  push:
    branches: [main]
    paths: ["report_template.html", "collector.py", "data/firebase.json"]   # 화면/코드 수정 시 페이지만 다시 만듦

permissions:
  contents: write    # data/store.json 커밋
  pages: write
  id-token: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 (예약/수동 실행일 때만)
        if: github.event_name != 'push'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          BOARD_KEY: ${{ secrets.BOARD_KEY }}
          ALERT_SHOW_TAGS: ${{ vars.ALERT_SHOW_TAGS }}
          MODE_ARGS: ${{ github.event.schedule == '0 4,9 * * *' && '--results-only' || '' }}
        run: python collector.py --store json --site _site $MODE_ARGS

      - name: 페이지만 다시 만들기 (코드 push 일 때)
        if: github.event_name == 'push'
        run: python collector.py --store json --site-only --site _site

      - name: 수집 데이터 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store.json data/stats.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "수집 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main   # 그 사이 화면에서 저장한 state.json 커밋과 합치기
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
